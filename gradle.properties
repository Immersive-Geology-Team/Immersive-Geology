org.gradle.jvmargs=-Xmx8G
# ForgeGradle serves a "-recomp.jar" (Minecraft recompiled from decompiled sources) once the
# MC sources jar has been generated. That jar loses access transformers targeting Forge's own
# classes, because net.minecraftforge.* is recompiled from Forge's pristine sources.
# Disabling recompile makes FG serve the AT-ed binary jar instead.
systemProp.net.minecraftforge.gradle.repo.recompile=false
org.gradle.daemon=false
version_minecraft=1.20.1
version_parchment=1.19.3-2023.06.25
version_patchouli=81
version_forge=47.3.0
version_ie=1.20.1-10.2.0-182
version_jei=15.2.0.23
version_cctweaked=1.102.0-SNAPSHOT
modid=immersivegeology

