// ----------------------------------------------------------------------------
// TEST CONFIG, JAR SIGNING, EXTRA TASKS
// ----------------------------------------------------------------------------

tasks.named('test') {
    useJUnitPlatform()
    outputs.upToDateWhen { false }
    testLogging.events 'passed', 'skipped', 'failed'
}

tasks.register('copyModsTomlForIntelliJ', Copy) {
    from tasks.processResources.get().destinationDir
    into "$projectDir/out/production/resources"
    include 'META-INF/mods.toml'
}
tasks.named('copyModsTomlForIntelliJ') { dependsOn tasks.processResources }

tasks.register('signJar', SignJar) {
    onlyIf    { project.hasProperty('keyStore') }
    keyStore  = project.findProperty('keyStore')
    alias     = project.findProperty('storeAlias')
    storePass = project.findProperty('storePass')

    inputFile = shadowJar.archiveFile
    outputFile = shadowJar.archiveFile
    dependsOn tasks.named('shadowJar')
}

tasks.named('build') { dependsOn tasks.named('signJar') }

tasks.register('datagenJar', Jar) {
    dependsOn tasks.named('datagenClasses')
    archiveClassifier.set('datagen')
    from sourceSets.datagen.output
    manifest { attributes 'FMLModType': 'GAMELIBRARY' }
}

tasks.register('sourcesJar', Jar) {
    dependsOn tasks.classes
    archiveClassifier.set('sources')
    from sourceSets.main.allSource, sourceSets.datagen.allSource
}
artifacts {
    archives tasks.named('sourcesJar')
    archives tasks.named('datagenJar')
}

void minimizePNGFile(File file) {
    long oldSize = file.length()
    exec { executable 'optipng'; args '-q','-o7','-zm1-9','-strip','all', file }
    long newSize = file.length()
    if (newSize < oldSize) println "Optimized ${file.name}: ${oldSize} → ${newSize} bytes"
}

tasks.register('optimizePng') {
    doLast {
        sourceSets.main.resources.srcDirs.each { dir ->
            fileTree(dir: dir, includes: ['**/*.png']).each { minimizePNGFile(it) }
        }
    }
}

tasks.register('speedUpPreRun') {
    doLast {
        ['Client','Server','Data'].each { type ->
            ant.replace(
                    file: ".idea/runConfigurations/run${type}.xml",
                    token: "prepareRun${type}",
                    value: 'prepareRuns'
            )
        }
    }
}

tasks.withType(org.gradle.api.tasks.TaskContainer) {
    it.matching { it.name == 'genIntellijRuns' }.all    { finalizedBy tasks.named('speedUpPreRun') }
    it.matching { it.name == 'runServer'      }.all    { standardInput = System.in }
}

tasks.register('genIntellijRunsDummy') {}

def customGradle = rootProject.file('custom.gradle')
if (customGradle.exists()) apply from: customGradle
afterEvaluate {
    tasks.named('reobfJar').configure { enabled = true }
}