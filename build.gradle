import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import groovy.json.JsonParserType
import net.minecraftforge.gradle.common.tasks.SignJar

plugins {
    id 'net.minecraftforge.gradle'         version '[6.0,6.2)'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin'         version '0.7-SNAPSHOT'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.6'
    id 'eclipse'
    id 'idea'
}
// Load version and build number from version.properties
import java.util.Properties

def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }

version = versionProps.getProperty('version')
ext.version_buildnumber = versionProps.getProperty('build_number')?.toInteger() ?: 0

println "-> build.gradle applying version: $version (build ${version_buildnumber})"

gradle.taskGraph.whenReady { graph ->
    // Only bump build number when doing a full build
    if (graph.hasTask(':build')) {
        ext.version_buildnumber = gradle.ext.nextBuildNumber
    } else {
        // preserve existing build number for non-build tasks
        ext.version_buildnumber = project.findProperty('version_buildnumber') ?: 0
    }
}

group = 'com.igteam.immersivegeology'
archivesBaseName = 'ImmersiveGeology'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// ----------------------------------------------------------------------------
// RESOURCE EXPANSION & REPLACEMENTS
// ----------------------------------------------------------------------------

// 1) read the published version
version = gradle.ext.nextVersion
// 2) version_buildnumber set via taskGraph.whenReady above

println "-> build.gradle applying version: $version (build ${version_buildnumber})"

ext {
    versionReplacements = [
            version        : project.version,
            build_number   : version_buildnumber,
            mc_version     : version_minecraft,
            forge_version  : version_forge,
            jei_version    : version_jei,
            mod_license    : mod_license,
            mod_name       : mod_name,
            mod_authors    : mod_authors,
            mod_description: mod_description,
            version_ie     : version_ie
    ]
}

sourceSets {
    main {
        resources {
            srcDirs = [
                    "$rootDir/src/main/resources",
                    "$rootDir/src/generated/resources"
            ]
        }
    }
    datagen {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
    gametest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.FAIL

    // Declare inputs so Gradle can track changes
    inputs.property 'mod_version', project.version
    inputs.property 'mod_buildNumber', version_buildnumber
    inputs.properties versionReplacements

    filesMatching('META-INF/mods.toml') {
        expand versionReplacements
    }
    exclude '.cache'

    doLast {
        def slurper = new JsonSlurper()
        // For lenient parsing (if you ever need comments/trailing commas):
        // slurper.setType(JsonParserType.LAX)

        fileTree(dir: outputs.files.asPath, include: ['**/*.json', '**/*.mcmeta']).each { File f ->
            try {
                def parsed = slurper.parse(f)
                f.text = JsonOutput.prettyPrint(JsonOutput.toJson(parsed))
            } catch (Exception e) {
                logger.warn("Skipping invalid JSON file ${f.name}: ${e.message}")
            }
        }
    }
}

tasks.withType(Jar).configureEach {
    zip64 = true
}

// ----------------------------------------------------------------------------
// FORGE RUNS & DEPENDENCIES
// ----------------------------------------------------------------------------

minecraft {
    mappings channel: 'parchment', version: "1.19.3-2023.06.25-1.20.1"
    accessTransformers {
        file 'src/main/resources/META-INF/accesstransformer.cfg'
    }
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN'
            property 'forge.enabledGameTestNamespaces', 'immersivegeology'
            property 'forge.logging.console.level', 'debug'
            ideaModule "${project.name}.main"
            mods { immersivegeology { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.enabledGameTestNamespaces', 'immersivegeology'
            property 'forge.logging.console.level', 'debug'
            arg '-nogui'
            mods { immersivegeology { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            property 'fml.earlyprogresswindow', 'false'
            args '--mod', 'immersivegeology', '--all',
                    '--output', file('src/generated/resources/'),
                    '--validate', '--existing', sourceSets.main.resources.srcDirs[0]
            ideaModule "${project.name}.datagen"
            mods {
                immersivegeology {
                    source sourceSets.main
                    source sourceSets.datagen
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.enabledGameTestNamespaces', 'immersivegeology'
            property 'forge.logging.console.level', 'debug'
            arg '-nogui'
            ideaModule "${project.name}.gametest"
            mods {
                immersivegeology {
                    source sourceSets.main
                    source sourceSets.gametest
                }
            }
        }
    }
}

repositories {
    maven { url 'https://maven.blamejared.com/' }
    maven { url 'https://www.cursemaven.com' }
    maven { url 'https://cfa2.cursemaven.com' }
    maven {
        url 'https://squiddev.cc/maven/'
        content {
            includeGroup 'cc.tweaked'
            includeModule 'org.squiddev', 'Cobalt'
        }
    }
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    minecraft            "net.minecraftforge:forge:${version_minecraft}-${version_forge}"
    compileOnly          fg.deobf("mezz.jei:jei-1.20.1-forge-api:${version_jei}")
    compileOnly          fg.deobf("mezz.jei:jei-1.20.1-common-api:${version_jei}")
    implementation       fg.deobf("mezz.jei:jei-1.20.1-forge:${version_jei}")
    implementation fg.deobf("curse.maven:immersive-engineering-231951:6206989")
    datagenImplementation "blusunrize.immersiveengineering:ImmersiveEngineering:${version_ie}:datagen"
    implementation       fg.deobf("curse.maven:terrafirmacraft-302973:6187491")
    implementation       fg.deobf("curse.maven:patchouli-306770:6164575")
    implementation       fg.deobf("curse.maven:engineered-schematics-1207780:6293337")
    implementation fg.deobf("curse.maven:chisels-bits-231095:5203366")
    //implementation fg.deobf("curse.maven:distant-horizons-508933:6791186")
    implementation fg.deobf("curse.maven:observable-509575:5643037")
    implementation fg.deobf("curse.maven:architectury-api-419699:5137938")
    implementation fg.deobf("curse.maven:kotlin-for-forge-351264:5402061")
    implementation fg.deobf("curse.maven:pipez-443900:6368313")
    implementation fg.deobf("curse.maven:journeymap-32274:5789363")
    testImplementation    'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly      'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    annotationProcessor  'org.spongepowered:mixin:0.8.5:processor'
