import groovy.json.JsonOutput
import groovy.json.JsonSlurper
// import groovy.json.JsonParserType

plugins {
    id 'net.neoforged.moddev' version '2.0.147'
}

def nextBuildNumber = gradle.ext.nextBuildNumber
def versionFile = file('version.properties')

version = gradle.ext.nextVersion
ext.version_buildnumber = nextBuildNumber

println "-> build.gradle applying version: $version (build ${version_buildnumber})"

tasks.named('build') {
    // Only bump build number when doing a full build
    doLast {
        def versionProps = new Properties()
        versionFile.withInputStream { versionProps.load(it) }
        versionProps.setProperty('build_number', nextBuildNumber.toString())
        versionFile.withOutputStream { versionProps.store(it, null) }
    }
}

group = 'com.igteam.immersivegeology'
base.archivesName = 'ImmersiveGeology'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// ----------------------------------------------------------------------------
// RESOURCE EXPANSION & REPLACEMENTS
// ----------------------------------------------------------------------------

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            version        : project.version,
            build_number   : version_buildnumber,
            mc_version     : version_minecraft,
            neo_version    : version_neo,
            jei_version    : version_jei,
            mod_license    : mod_license,
            mod_name       : mod_name,
            mod_authors    : mod_authors,
            mod_description: mod_description,
            version_ie     : version_ie,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

configurations { atCli }

def atFile = file('src/main/resources/META-INF/accesstransformer.cfg')
def neoForgeVersionForAt = project.version_neo.toString()
def neoForgeInputJar = configurations.compileClasspath.filter {
    it.name == "neoforge-${neoForgeVersionForAt}.jar" || it.name == "neoforge-${neoForgeVersionForAt}-merged.jar"
}
def patchedNeoForgeJar = layout.buildDirectory.file('atCompileJar/neoforge-at.jar')

def patchNeoForgeJar = tasks.register('patchNeoForgeJar', JavaExec) {
    classpath = configurations.atCli
    mainClass = 'net.neoforged.accesstransformer.cli.TransformerProcessor'

    inputs.file atFile
    inputs.files neoForgeInputJar
    outputs.file patchedNeoForgeJar

    doFirst { JavaExec task ->
        def inputJar = neoForgeInputJar.singleFile
        def outputJar = patchedNeoForgeJar.get().asFile
        outputJar.parentFile.mkdirs()

        task.args '--inJar', inputJar.absolutePath,
                '--outJar', outputJar.absolutePath,
                '--atFile', atFile.absolutePath
    }
}

sourceSets {
    main {
        resources {
            srcDirs = [
                    "$rootDir/src/main/resources",
                    "$rootDir/src/generated/resources"
            ]
            srcDir generateModMetadata
        }
    }
    datagen {
        compileClasspath += main.output + main.compileClasspath
        compileClasspath = files(patchNeoForgeJar) + compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
    gametest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    exclude '.cache'

    doLast {
        def slurper = new JsonSlurper()
        // For lenient parsing (if you ever need comments/trailing commas):
        // slurper.setType(JsonParserType.LAX)

        fileTree(dir: outputs.files.asPath, include: ['**/*.json', '**/*.mcmeta']).each { File f ->
            try {
                def parsed = slurper.parse(f)
                f.text = JsonOutput.prettyPrint(JsonOutput.toJson(parsed))
            } catch (Exception e) {
                logger.warn("Skipping invalid JSON file ${f.name}: ${e.message}")
            }
        }
    }
}

tasks.withType(Jar).configureEach {
    zip64 = true
}

// ----------------------------------------------------------------------------
// NEOFORGE RUNS & DEPENDENCIES
// ----------------------------------------------------------------------------

neoForge {
    version = project.version_neo
    parchment {
        mappingsVersion = project.version_parchment
        minecraftVersion = project.version_minecraft
    }
    ideSyncTask generateModMetadata
    ideSyncTask patchNeoForgeJar
    // Default is false; do not set to true since MDG cannot validate AT targets in NeoForge classes.
    // validateAccessTransformers = false
    runs {
        client {
            client()
            systemProperty 'forge.logging.markers', 'SCAN'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'immersivegeology'
        }
        server {
            server()
            systemProperty 'forge.logging.markers', ''
            systemProperty 'neoforge.enabledGameTestNamespaces', 'immersivegeology'
            programArgument '--nogui'
        }
        data {
            data()
            systemProperty 'forge.logging.markers', ''
            programArguments.addAll '--mod', 'immersivegeology', '--all',
                    '--output', file('src/generated/resources/').toString(),
                    '--validate', '--existing', sourceSets.main.resources.srcDirs[0].toString()
            sourceSet = sourceSets.datagen
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'immersivegeology'
            programArgument '--nogui'
            sourceSet = sourceSets.gametest
        }
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        immersivegeology {
            sourceSet sourceSets.main
            sourceSet sourceSets.datagen
            sourceSet sourceSets.gametest
        }
    }
    unitTest {
        enable()
        testedMod = mods.immersivegeology
    }
}

repositories {
    maven { url 'https://maven.neoforged.net/releases' }
    maven { url 'https://maven.blamejared.com/' }
    maven { url 'https://cfa2.cursemaven.com' }
    mavenCentral()
}

