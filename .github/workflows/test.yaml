name: Check that generated data is up to date and update data for web manual

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            build/fg_cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Compile IG
        run: ./gradlew compileJava
      - name: Run unit tests
        run: ./gradlew test
      - name: Update APT cached
        run: sudo apt update
      - name: Install ffprobe
        run: sudo apt install ffmpeg
      - name: Check for stereo sound files
        run: scripts/check_sounds.sh
  datagen:
    runs-on: ubuntu-latest
    needs: test  # Make sure this job runs after 'test'
    defaults:
      run:
        working-directory: main-repo  # Sets working directory for all steps in this job
    steps:
      # Checkout repository into 'main-repo' directory
      - uses: actions/checkout@v3
        with:
          path: main-repo  # Checkout the repo to the 'main-repo' directory
  
      # Set up JDK 17 (ensure that it's compatible with your Gradle build)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'  # Ensure Temurin JDK 17 is available
  
      # List existing generated resources (for later comparison)
      - name: Create list of existing generated resources
        run: find src/generated/resources/ ! -path "**/.cache*" > resources.txt
  
      # Run the data generation (ensure xvfb is necessary)
      - name: Run data generation
        run: xvfb-run --auto-servernum bash -c "./gradlew runData"
   
