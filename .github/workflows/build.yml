name: Build

on: [ push ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1000
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-mod-artifacts
          path: build/libs/*.jar

  notify-discord:
    continue-on-error: true
    name: Notify Discord
    runs-on: ubuntu-latest
    concurrency:
      group: discord
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Notify Discord
        env:
          COMMIT_FROM: ${{ github.event.before }}
          COMMIT_TO: ${{ github.event.after }}
          WEBHOOK: ${{ secrets.WH_PUSH_PUBLIC }}
          REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.custom_properties.project_pretty_name }}
        run: cd ./.github/workflows/ ; chmod +rx discord_commit.sh ; bash discord_commit.sh -i
