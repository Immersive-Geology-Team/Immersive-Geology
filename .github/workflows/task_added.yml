name: Issue Added

on:
  issues:
    types: [ opened ]

permissions: {}

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    name: Notify Discord
    steps:
      - name: Notify Internal Discord
        env:
          WEBHOOK: ${{ secrets.WH_TASK_ADDED }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::error::The WH_TASK_ADDED secret is not set"; exit 1; fi
          MESSAGE="Task [$TITLE](<$URL>) has been added to the project."
          jq -n --arg content "$MESSAGE" '{content: $content}' | curl -sSf -H "Content-Type: application/json" -d @- "$WEBHOOK"
