pluginManagement {
    repositories {
        gradlePluginPortal {
            content { excludeGroup 'org.apache.logging.log4j' }
        }
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.wagyourtail.xyz/releases' }
        maven { url = 'https://maven.wagyourtail.xyz/snapshots' }
        maven { url = 'https://maven.arcseekers.com/releases' }
        maven { url = 'https://maven.cleanroommc.com' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "ImmersiveGeology-${version_minecraft}"

def propsFile = file('version.properties')
def props = new Properties()
props.load(new FileInputStream(propsFile))

def baseVersion = props['version']
def currentBuild = props['build_number'].toInteger()
def nextBuild = currentBuild + 1

props['build_number'] = nextBuild.toString()
props.store(new FileOutputStream(propsFile), null)

gradle.ext.nextVersion = "${baseVersion}-b${nextBuild}"
gradle.ext.nextBuildNumber = nextBuild

println "-> settings.gradle bumped to ${gradle.ext.nextVersion}"
